# Render Blueprint: база данных и API таблицы лидеров.
# Статический сайт fin-audit-rl-gym (папка site) создан отдельно и обновляется автоматически.
databases:
  - name: fin-audit-db
    plan: free
    databaseName: finaudit
    user: finaudit

services:
  - type: web
    name: fin-audit-api
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: python api/server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: https://fin-audit-rl-gym.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: fin-audit-db
          property: connectionString
