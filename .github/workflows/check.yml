name: FinSpector check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run complete verification
        run: python -m auditenv check
      - name: Verify artifact export
        run: python -m auditenv export
